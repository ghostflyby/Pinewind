name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: swift-format lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: swift-format lint
        run: xcrun swift-format lint --strict --recursive Sources Tests

  macos-test:
    name: macOS · swift test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Identify macOS build environment
        id: swiftpm-environment
        run: |
          fingerprint=$(
            {
              swift --version
              xcodebuild -version
              xcrun --sdk macosx --show-sdk-build-version
              sw_vers -buildVersion
            } | shasum -a 256 | cut -d ' ' -f 1
          )
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM build and dependencies
        uses: actions/cache@v6
        with:
          path: .build
          key: macos-swiftpm-v1-${{ runner.arch }}-${{ steps.swiftpm-environment.outputs.fingerprint }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
      - name: swift test
        run: swift test --no-parallel
      - name: Public API compile contracts
        run: python3 Scripts/check-api-boundaries.py

  linux-test:
    name: Linux · swift test
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v7
      - name: Install C dependencies
        run: |
          apt-get update
          apt-get install -y zlib1g-dev libssl-dev pkg-config ca-certificates
      - name: Identify Linux build environment
        id: swiftpm-environment
        run: |
          fingerprint=$(
            {
              swift --version
              dpkg-query -W
            } | sha256sum | cut -d ' ' -f 1
          )
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM build and dependencies
        uses: actions/cache@v6
        with:
          path: .build
          key: linux-swiftpm-v1-${{ runner.arch }}-${{ steps.swiftpm-environment.outputs.fingerprint }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
      - name: swift test
        run: swift test --no-parallel

  windows-test:
    name: Windows · swift test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: SwiftyLab/setup-swift@v1
        id: swift
        with:
          swift-version: '6.3.1'
      - name: Identify Windows image
        id: windows-image
        run: '"version=$env:ImageVersion" >> $env:GITHUB_OUTPUT'
      - name: Cache SwiftPM build and dependencies
        uses: actions/cache@v6
        with:
          path: .build
          key: windows-swiftpm-v1-${{ runner.arch }}-${{ steps.windows-image.outputs.version }}-${{ steps.swift.outputs.swift-version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
      - name: swift test
        run: swift test --no-parallel

  ios-test:
    name: iOS · build and simulator test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Identify Xcode toolchain
        id: xcode
        run: |
          fingerprint=$(
            {
              xcodebuild -version
              xcrun --sdk iphonesimulator --show-sdk-build-version
              sw_vers -buildVersion
            } | shasum -a 256 | cut -d ' ' -f 1
          )
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Cache Xcode build and dependencies
        uses: irgaly/xcode-cache@v1
        with:
          key: ios-deriveddata-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.fingerprint }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ios-deriveddata-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.fingerprint }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
          swiftpm-package-resolved-file: Package.resolved
          restore-mtime-targets: |
            Tests/**/*
            Package.resolved
      - name: Select simulator
        run: |
          if ! sim_id=$(
            xcrun simctl list devices available --json | jq -er '
              first(
                .devices | to_entries[]
                | select(.key | contains(".iOS-"))
                | .value[]
                | select(.isAvailable and (.name | startswith("iPhone")))
                | .udid
              )
            '
          ); then
            echo "::error::Cannot select an available iPhone simulator"
            exit 1
          fi
          echo "SIM_ID=$sim_id" >> "$GITHUB_ENV"
      - name: Prepare diagnostics directory
        run: mkdir -p "$RUNNER_TEMP/pinewind-ios-diagnostics"
      - name: Build and test on iOS Simulator
        uses: sersoft-gmbh/xcodebuild-action@v4
        with:
          spm-package: .
          scheme: Pinewind
          destination: platform=iOS Simulator,id=${{ env.SIM_ID }}
          result-bundle-path: ${{ runner.temp }}/pinewind-ios-diagnostics/Pinewind.xcresult
          parallel-testing-enabled: false
          disable-automatic-package-resolution: true
          skip-macro-validation: true
          skip-package-plugin-validation: true
          build-settings: CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO
          output-formatter: tee "${{ runner.temp }}/pinewind-ios-diagnostics/ios-test.log"
      - name: Collect diagnostics
        if: always()
        run: |
          diagnostics="$RUNNER_TEMP/pinewind-ios-diagnostics"
          mkdir -p "$diagnostics"
          if [ -d "$diagnostics/Pinewind.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "$diagnostics/Pinewind.xcresult" \
              > "$diagnostics/test-summary.json" 2>&1 || true
          fi
          cp ~/Library/Logs/DiagnosticReports/*.ips "$diagnostics/" 2>/dev/null || true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-diagnostics
          path: ${{ runner.temp }}/pinewind-ios-diagnostics
          if-no-files-found: warn
      - name: Failure diagnostics dump
        if: failure()
        run: |
          diagnostics="$RUNNER_TEMP/pinewind-ios-diagnostics"
          if [ -f "$diagnostics/test-summary.json" ]; then
            cat "$diagnostics/test-summary.json"
          fi
          if [ -f "$diagnostics/ios-test.log" ]; then
            tail -n 100 "$diagnostics/ios-test.log"
          fi
