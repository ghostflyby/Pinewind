name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: swift-format lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: swift-format lint
        run: xcrun swift-format lint --strict --recursive Sources Tests

  macos-test:
    name: macOS · swift test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: swift test
        run: swift test --no-parallel

  linux-test:
    name: Linux · swift test
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v7
      - name: Install C dependencies
        run: |
          apt-get update
          apt-get install -y zlib1g-dev libssl-dev pkg-config ca-certificates
      - name: swift test
        run: swift test --no-parallel

  windows-test:
    name: Windows · swift test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: '6.3.1'
      - name: swift test
        run: swift test --no-parallel

  ios-test:
    name: iOS · build and simulator test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Identify Xcode toolchain
        id: xcode
        run: |
          fingerprint=$(
            {
              xcodebuild -version
              xcrun --sdk iphonesimulator --show-sdk-build-version
              sw_vers -buildVersion
            } | shasum -a 256 | cut -d ' ' -f 1
          )
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Cache Xcode build and dependencies
        uses: irgaly/xcode-cache@v1
        with:
          key: ios-deriveddata-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.fingerprint }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ios-deriveddata-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.fingerprint }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
          swiftpm-package-resolved-file: Package.resolved
          restore-mtime-targets: |
            Tests/**/*
            Package.resolved
      - name: Select simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - "$RUNNER_TEMP/simulators.json" >> "$GITHUB_ENV" <<'PY'
          import json
          import sys

          with open(sys.argv[1]) as file:
              devices = json.load(file)["devices"]
          for runtime, entries in devices.items():
              if ".iOS-" not in runtime:
                  continue
              for device in entries:
                  if device["name"].startswith("iPhone") and device.get("isAvailable", False):
                      print("SIM_ID=" + device["udid"])
                      sys.exit(0)
          sys.exit("No available iPhone simulator")
          PY
      - name: Prepare diagnostics directory
        run: mkdir -p ci-output
      - name: Build and test on iOS Simulator
        uses: sersoft-gmbh/xcodebuild-action@v4
        with:
          spm-package: .
          scheme: Pinewind
          destination: platform=iOS Simulator,id=${{ env.SIM_ID }}
          result-bundle-path: ci-output/Pinewind.xcresult
          parallel-testing-enabled: false
          disable-automatic-package-resolution: true
          skip-macro-validation: true
          skip-package-plugin-validation: true
          build-settings: CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO
          output-formatter: tee ci-output/ios-test.log
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          if [ -d ci-output/Pinewind.xcresult ]; then
            cp -R ci-output/Pinewind.xcresult diagnostics/
            xcrun xcresulttool get test-results summary --path ci-output/Pinewind.xcresult \
              > diagnostics/test-summary.json 2>&1 || true
          fi
          if [ -f ci-output/ios-test.log ]; then
            cp ci-output/ios-test.log diagnostics/
          fi
          cp ~/Library/Logs/DiagnosticReports/*.ips diagnostics/ 2>/dev/null || true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-diagnostics
          path: diagnostics
          if-no-files-found: warn
      - name: Failure diagnostics dump
        if: failure()
        run: |
          if [ -f diagnostics/test-summary.json ]; then
            cat diagnostics/test-summary.json
          fi
          if [ -f diagnostics/ios-test.log ]; then
            tail -n 100 diagnostics/ios-test.log
          fi
